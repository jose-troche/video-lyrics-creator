    clip: /Users/jatroche/code/video-lyrics-creator/work/dinner-for-5k/overlay-clips/lyric-038-29e75ab3fda846de-0bdb6ce76fe76870.mov
  - start: 129.76
    end: 132.4
    text: We fumble around with our little plans
