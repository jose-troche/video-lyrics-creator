    clip: /Users/jatroche/code/video-lyrics-creator/work/dinner-for-5k/overlay-clips/lyric-033-ab78b83222ac070a-f8f95772a72dc9fa.mov
  - start: 111.86
    end: 114.72
    text: The One who fills the universe made His choice
