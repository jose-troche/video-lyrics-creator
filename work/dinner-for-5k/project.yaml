    clip: /Users/jatroche/code/video-lyrics-creator/work/dinner-for-5k/overlay-clips/lyric-037-22e2635b19de95a7-88b8c5f9a4d1b81e.mov
  - start: 126.94
    end: 129.76
    text: When you lose your job and you wonder why
