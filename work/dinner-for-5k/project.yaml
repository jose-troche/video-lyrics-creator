    clip: /Users/jatroche/code/video-lyrics-creator/work/dinner-for-5k/overlay-clips/lyric-040-801cc501d2e74892-a17165535598bfe2.mov
  - start: 135.26
    end: 137.92
    text: Human efforts fail, our strength runs dry
