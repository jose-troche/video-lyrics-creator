    clip: /Users/jatroche/code/video-lyrics-creator/work/dinner-for-5k/overlay-clips/lyric-039-2b74eb90140e513b-87a105047d83ec94.mov
  - start: 132.4
    end: 135.26
    text: But Jesus holds the universe in His hands
