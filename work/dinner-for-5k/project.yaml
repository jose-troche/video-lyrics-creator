    clip: /Users/jatroche/code/video-lyrics-creator/work/dinner-for-5k/overlay-clips/lyric-036-1e2259a3caf04e53-f8f95772a72dc9fa.mov
  - start: 123.47
    end: 126.94
    text: Now when life gets crazy and bills pile high
