    clip: /Users/jatroche/code/video-lyrics-creator/work/dinner-for-5k/overlay-clips/lyric-043-2aed5e4884cd0a63-87a105047d83ec94.mov
  - start: 143.22
    end: 148.48
    text: The omnipotent Savior makes everything right!
